services:

  migrate:
    container_name: weather-hub-migrate
    build:
      context: ./weather-hub
    restart: "no"
    environment:
      # Standard libpq env vars - node-pg-migrate's CLI picks these up natively
      # when DATABASE_URL isn't set, so no extra config is needed here.
      PGHOST: ${DB_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-weatherhub}
    command: ["npm", "run", "migrate"]

  weather-hub:
    container_name: weather-hub-api
    build:
      context: ./weather-hub
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEATHER_HUB_PORT:-8100}:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: ${DB_HOST:-db}
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DATABASE_NAME: ${POSTGRES_DB:-weatherhub}
      # Must match the URL the dashboard is actually loaded from in the browser
      # (see WEATHER_DASHBOARD_API_SERVER / WEATHER_DASHBOARD_PORT below).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8200}

  weather-dashboard:
    container_name: weather-hub-dashboard
    build:
      context: ./weather-dashboard
      args:
        # Rebuild this service (--build) after changing these vars.
        VITE_API_SCHEME: ${WEATHER_DASHBOARD_API_SCHEME:-http}
        VITE_API_SERVER: ${WEATHER_DASHBOARD_API_SERVER:-localhost}
        # VITE_API_PORT is always sourced from WEATHER_HUB_PORT, which also sets
        # the published port mapping below - it can't be left blank here even
        # for https, unlike the sensor's SENSOR_SERVER_PORT. Set WEATHER_HUB_PORT
        # to the real public port (e.g. 443) if going through a TLS reverse proxy.
        VITE_API_PORT: ${WEATHER_HUB_PORT:-8100}
    restart: always
    depends_on:
      weather-hub:
        condition: service_started
    ports:
      - "${WEATHER_DASHBOARD_PORT:-8200}:80"